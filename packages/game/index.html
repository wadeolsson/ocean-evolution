<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ocean Evolution &mdash; world flythrough</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>&#127754;</text></svg>">
<style>
  html,body { margin:0; height:100%; background:#04121f; overflow:hidden;
              font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; color:#cfe3f0; }
  canvas { display:block; }
  #hud { position:fixed; top:12px; left:12px; pointer-events:none;
         background:rgba(4,14,24,.72); border:1px solid rgba(120,180,210,.22);
         border-radius:8px; padding:10px 13px; backdrop-filter:blur(6px); max-width:min(94vw,760px); }
  #hud b { color:#6fd8ef; font-weight:600; }
  #hud .row { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #hud .biome { color:#fff; font-size:14px; margin-bottom:3px; }
  #hud .feat { color:#8fb6cc; }
  #keys { position:fixed; bottom:92px; left:12px; pointer-events:none; color:#6b8699;
          background:rgba(4,14,24,.6); border-radius:7px; padding:7px 11px; }
  #keys kbd { color:#9fc6da; background:rgba(255,255,255,.07); border-radius:3px; padding:0 4px; }
  #fps { position:fixed; top:12px; right:12px; color:#5f7f94; pointer-events:none;
         background:rgba(4,14,24,.6); border-radius:6px; padding:5px 9px; }
</style>
</head>
<body>
<div id="hud">
  <div class="row biome" id="h-biome">&nbsp;</div>
  <div class="row feat" id="h-feat">&nbsp;</div>
  <div class="row" id="h-pos">&nbsp;</div>
  <div class="row" id="h-env">&nbsp;</div>
</div>
<div id="keys">
  <kbd>WASD</kbd> swim &middot; <kbd>shift</kbd> sprint &middot; <kbd>wheel</kbd>/<kbd>QE</kbd> zoom &middot;
  <kbd>1</kbd>&ndash;<kbd>9</kbd> jump to feature &middot; <kbd>0</kbd> deep features &middot; <kbd>G</kbd> habitat tint &middot; <kbd>C</kbd> current field &middot; <kbd>V</kbd> haze
</div>
<div id="fps">&nbsp;</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
